[workspace]
members = ["rimu-json", "rimu-json-derive", "bench"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
rust-version = "1.89"

[profile.bench]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"
